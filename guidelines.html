<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emergency guidelines</title>
  <link rel="stylesheet" href="css/css/style.css">
</head>
<body>
  <main class="container">
    <div id="guideBox">
      <h1 data-i18n="guide_title"></h1>
      <p data-i18n="guide_intro"></p>
      <ul class="guide">
        <li data-i18n="g1"></li>
        <li data-i18n="g2"></li>
        <li data-i18n="g3"></li>
        <li data-i18n="g4"></li>
        <li data-i18n="g5"></li>
        <li data-i18n="g6"></li>
        <li data-i18n="g7"></li>
        <li data-i18n="g8"></li>
      </ul>
      <p class="notice" data-i18n="guide_cta"></p>
    </div>
    <button class="btn" data-speak="#guideBox" data-i18n="read_aloud"></button>
  </main>
  <script src="js/js/common.js"></script>
  <script src="js/js/speech.js"></script>
</body>
</html>
